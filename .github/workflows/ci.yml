name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-checks:
    name: Rust Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev \
            libwayland-dev \
            wayland-protocols \
            libvulkan-dev \
            libpulse-dev \
            libfontconfig1-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@a54c7fe93be34c9780b6215ea577747f0fdd3830 # stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@82a92a6e8fbeee08c636d40a3633ed429215208c # v2.7.7

      - name: Check code formatting
        run: cargo fmt -- --check

      - name: Typecheck workspace
        run: cargo check --workspace

      - name: Run unit and integration tests
        run: cargo test --workspace

      - name: Run clippy linter
        run: cargo clippy --workspace --all-targets -- -D warnings

  security-and-lint:
    name: Security & Shell Auditing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full git history)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: ShellCheck validation
        run: shellcheck scripts/*.sh scripts/fw-open setup.sh install.sh

      - name: Run Gitleaks secret audit
        uses: gitleaks/gitleaks-action@e33a88fb0b94b005fe43fe539b78ca9489fc9ff6 # v2.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"

      - name: Install Semgrep & pre-commit
        run: pip install semgrep==1.93.0 pre-commit==4.1.0

      - name: Run Semgrep static analysis
        run: semgrep --config=.semgrep.yml --error .

      - name: Run pre-commit hooks (skipping redundant cargo & gitleaks steps)
        run: SKIP=gitleaks,cargo-fmt,cargo-check,cargo-clippy pre-commit run --all-files

  installer-test:
    name: Installer & Setup Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Test dry-run leaves isolated HOME empty
        run: |
          TEST_HOME="$(mktemp -d)"
          HOME="${TEST_HOME}" ./setup.sh sway --no-build --dry-run
          if [ -n "$(ls -A "${TEST_HOME}")" ]; then
            echo "Error: --dry-run created files in HOME:" >&2
            ls -la "${TEST_HOME}" >&2
            exit 1
          fi
          rm -rf "${TEST_HOME}"

      - name: Test live setup and symlink integrity
        run: |
          TEST_HOME="$(mktemp -d)"
          HOME="${TEST_HOME}" ./setup.sh sway --no-build
          test -L "${TEST_HOME}/.config/sway"
          test -L "${TEST_HOME}/.config/fuzzel"
          test -L "${TEST_HOME}/.config/foot"
          test -L "${TEST_HOME}/.config/mako"
          test -L "${TEST_HOME}/.config/starship.toml"
          test -L "${TEST_HOME}/.zshrc"
          test -x "${TEST_HOME}/.local/bin/terminal-select"
          test -x "${TEST_HOME}/.local/bin/fw-open"
          rm -rf "${TEST_HOME}"
