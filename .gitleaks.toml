# Gitleaks configuration for dotfield
title = "dotfield gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Global allowlist for build artifacts and dummy test tokens"
paths = [
  '''target/.*'''
]
regexes = [
  '''(?i)example[_-]?key''',
  '''(?i)sample[_-]?secret''',
  '''00000000-0000-0000-0000-000000000000'''
]
