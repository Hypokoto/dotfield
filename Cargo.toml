[workspace]
members = [
    "crates/amane-shell",
    "crates/amane",
]
exclude = [
    "crates/amane/cli",
    "crates/amane/cli/template/example",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Dotfield Contributors"]
license = "MIT"
repository = "https://github.com/hypokoto/dotfield"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "1.0"
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
colored = "2.1"
tempfile = "3.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = false

[profile.dev]
debug = 1
incremental = false

[profile.test]
debug = 1
incremental = false
