[workspace]
members = [
    "crates/dotfield-core",
    "crates/dotfield-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Dotfield Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/hypokoto/dotfield"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "1.0"
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
colored = "2.1"
similar = "2.4"
walkdir = "2.4"
tempfile = "3.10"
