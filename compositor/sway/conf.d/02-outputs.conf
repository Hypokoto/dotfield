# Sway Output & Display Configuration
# Low-latency, tear-free Wayland presentation with zero animation delay

# Output Optimization: lowest render latency (instant 0ms frame commit)
output * max_render_time 1
output * adaptive_sync on

# Default Display Profile
output eDP-1 mode 1920x1080@144.003Hz pos 0 0

# Autostart Wallpaper & Daemons
exec_always ~/.config/dotfield/scripts/wallpaper.sh
exec mako
exec kanshi
