# Sway Input Devices Configuration
# Snappy typing latency and ergonomic touchpad behaviors

input "type:keyboard" {
    xkb_layout "us"
    xkb_options "caps:escape"
    repeat_delay 200
    repeat_rate 50
}

input "type:touchpad" {
    dwt enabled
    tap enabled
    natural_scroll enabled
    middle_emulation enabled
}
