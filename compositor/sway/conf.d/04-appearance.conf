# Sway Appearance & Window Geometry
# Obsidian Mint — Tactical Interface (1.0px hairline borders)

# Window borders: 1px hairline tactical precision
default_border pixel 1
default_floating_border pixel 1
smart_borders on

# Window Gaps (Inner separation without outer margin bloat)
gaps inner 6
gaps outer 0
smart_gaps on

# Colors (Obsidian Mint: Void #080B0B, Obsidian #0E1413, Graphite #16201E, Iron #23322F, Minted White #ECFDF5, Mint #2DD4BF, Rose Critical #F43F5E)
# class                 border  bground text    indicator child_border
client.focused          #2DD4BF #16201E #ECFDF5 #2DD4BF   #2DD4BF
client.focused_inactive #23322F #0E1413 #94A3A0 #23322F   #23322F
client.unfocused        #23322F #080B0B #71827E #23322F   #23322F
client.urgent           #F43F5E #9F1239 #FFFFFF #F43F5E   #F43F5E
client.placeholder      #16201E #080B0B #ECFDF5 #16201E   #16201E
