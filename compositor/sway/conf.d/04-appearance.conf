# Sway Appearance & Window Geometry
# BLACKSITE Industrial Noir — Tactical Interface (1.0px hairline borders & 65-20-8-5-2 palette)

# Window borders: 1px hairline tactical precision
default_border pixel 1
default_floating_border pixel 1
smart_borders on

# Window Gaps (Inner separation without outer margin bloat)
gaps inner 6
gaps outer 0
smart_gaps on

# Colors (BLACKSITE Industrial Noir: Void #08080A, Obsidian #111216, Graphite #181920, Iron #282A36, Bone #E6E6EB, Amber #FFB000, Crimson #E63946)
# class                 border  bground text    indicator child_border
client.focused          #FFB000 #181920 #E6E6EB #FFB000   #FFB000
client.focused_inactive #282A36 #111216 #8F94A6 #282A36   #282A36
client.unfocused        #282A36 #08080A #606474 #282A36   #282A36
client.urgent           #E63946 #9D0208 #FFFFFF #E63946   #E63946
client.placeholder      #181920 #08080A #E6E6EB #181920   #181920
