# Sway Appearance & Window Geometry
# Cyber Synthwave — Tactical Interface (1.0px hairline borders)

# Window borders: 1px hairline tactical precision
default_border pixel 1
default_floating_border pixel 1
smart_borders on

# Window Gaps (Inner separation without outer margin bloat)
gaps inner 6
gaps outer 0
smart_gaps on

# Colors (Cyber Synthwave: Void #000000, Surface #140E29, Overlay #251B4A, Foreground #14B9B5, Blue #04C5F0, Danger #BE3F50)
# class                 border  bground text    indicator child_border
client.focused          #04C5F0 #251B4A #FFFFFF #04C5F0   #04C5F0
client.focused_inactive #251B4A #140E29 #14B9B5 #251B4A   #251B4A
client.unfocused        #251B4A #000000 #11AEB3 #251B4A   #251B4A
client.urgent           #BE3F50 #CE4F48 #FFFFFF #BE3F50   #BE3F50
client.placeholder      #140E29 #000000 #14B9B5 #140E29   #140E29
