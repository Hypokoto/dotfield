# Sway Floating Rules & Window Overlapping
# Ergonomic, multi-layered overlapping floating windows

# Floating Window Interaction: Super + Left Click drag, Super + Right Click resize
floating_modifier $mod normal

# Floating Window Constraints
floating_minimum_size 100 x 100
floating_maximum_size 1920 x 1080

# Overlapping Behavior & Focus
for_window [floating] focus_follows_mouse yes
for_window [floating] border none

# System Utilities & Dialog Floating Rules
for_window [app_id="dotfield-gui"] floating enable, sticky enable
for_window [app_id="floating-term"] floating enable, resize set 960 600
for_window [app_id="pavucontrol"] floating enable
for_window [app_id="imv"] floating enable
for_window [app_id="mpv"] floating enable
for_window [app_id="file-roller"] floating enable
for_window [app_id="swayimg"] floating enable

# Standard Wayland / X11 Dialogs and Popups
for_window [window_role="pop-up"] floating enable
for_window [window_role="bubble"] floating enable
for_window [window_role="dialog"] floating enable
for_window [window_type="dialog"] floating enable
for_window [window_type="menu"] floating enable
for_window [window_type="utility"] floating enable
