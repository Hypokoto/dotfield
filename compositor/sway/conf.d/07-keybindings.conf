# Sway Core Keybindings & Utility Controls
# Controlled Chaos Theme — Void Black · Crimson · Industrial Amber · Steel

# Core Application Launchers
# Super + Return launches configured default terminal directly
bindsym $mod+Return exec "$HOME/.config/dotfield/scripts/terminal-select.sh"

# Super + Shift + Return summons interactive Fuzzel Terminal Selector
bindsym $mod+Shift+Return exec "$HOME/.config/dotfield/scripts/terminal-select.sh" --select

# Super + Space summons Fuzzel Application Launcher
bindsym $mod+space exec fuzzel

# Window Controls & Session Management
bindsym $mod+q kill
bindsym $mod+Ctrl+r reload
bindsym $mod+Shift+e exec "command -v wlogout >/dev/null 2>&1 && wlogout || swaynag -t warning -m 'Exit Sway Session?' --background 08080A --border FFB000 --border-bottom FFB000 --text E6E6EB --button-background 181920 --button-text E6E6EB --button-border 282A36 -B 'Yes, exit' 'swaymsg exit'"

# Dotfield System Utilities & Screen Locking
bindsym $mod+Shift+d exec "$HOME/.config/dotfield/scripts/display-config.sh"
bindsym $mod+Shift+r exec "$HOME/.config/dotfield/scripts/screen-record.sh"
bindsym $mod+Escape exec "$HOME/.config/dotfield/scripts/lock.sh"

# Screen Capturing
bindsym Print exec "$HOME/.config/dotfield/scripts/screenshot.sh" --full
bindsym Shift+Print exec "$HOME/.config/dotfield/scripts/screenshot.sh" --area
bindsym $mod+Shift+s exec "$HOME/.config/dotfield/scripts/screenshot.sh" --area

# Hardware & Media Controls (OSD Integrated)
bindsym --locked XF86AudioRaiseVolume exec "$HOME/.config/dotfield/scripts/osd.sh" volume_up
bindsym --locked XF86AudioLowerVolume exec "$HOME/.config/dotfield/scripts/osd.sh" volume_down
bindsym --locked XF86AudioMute exec "$HOME/.config/dotfield/scripts/osd.sh" volume_mute
bindsym --locked XF86AudioMicMute exec "$HOME/.config/dotfield/scripts/osd.sh" mic_mute
bindsym --locked XF86MonBrightnessUp exec "$HOME/.config/dotfield/scripts/osd.sh" brightness_up
bindsym --locked XF86MonBrightnessDown exec "$HOME/.config/dotfield/scripts/osd.sh" brightness_down
bindsym --locked XF86AudioPlay exec "$HOME/.config/dotfield/scripts/osd.sh" media_play_pause
bindsym --locked XF86AudioNext exec "$HOME/.config/dotfield/scripts/osd.sh" media_next
bindsym --locked XF86AudioPrev exec "$HOME/.config/dotfield/scripts/osd.sh" media_prev

# Hardware Lid Switch Handlers (Clamshell Mode / Docking)
bindswitch --reload --locked lid:on exec "$HOME/.config/dotfield/scripts/lid-handler.sh" close
bindswitch --reload --locked lid:off exec "$HOME/.config/dotfield/scripts/lid-handler.sh" open
