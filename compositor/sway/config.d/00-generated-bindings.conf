# Dotfield Generated Sway Keybindings Fragment
# Target: ~/.config/sway/config.d/00-generated-bindings.conf
# This file is atomically compiled by Dotfield. Manual edits will be flagged as drift.

# Logical application bindings
bindsym --no-warn Mod4+Return exec "foot"
bindsym --no-warn Mod4+space exec "fuzzel"
bindsym --no-warn Mod4+Shift+space exec "rofi -show drun"
bindsym --no-warn Mod4+q kill
bindsym --no-warn Mod4+Shift+r reload
bindsym --no-warn Mod4+f fullscreen toggle
bindsym --no-warn Mod4+t floating toggle

# Keybind HUD (Slint overlay)
bindsym --no-warn Mod4+slash exec "dotfield-gui --hud"

# Phase 4 Utilities: Screenshots and Lockscreen
bindsym --no-warn Print exec "~/.config/dotfield/scripts/screenshot.sh --area"
bindsym --no-warn Shift+Print exec "~/.config/dotfield/scripts/screenshot.sh --full"
bindsym --no-warn Mod4+Escape exec "swaylock -f"
