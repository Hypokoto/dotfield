# Dotfield Generated Sway Keybindings Fragment
# Target: ~/.config/sway/config.d/00-generated-bindings.conf
# This file is atomically compiled by Dotfield. Manual edits will be flagged as drift.

# Logical application bindings
bindsym Mod4+Return exec foot
bindsym Mod4+space exec fuzzel
bindsym Mod4+Shift+space exec rofi -show drun
bindsym Mod4+q kill
bindsym Mod4+Shift+r reload
bindsym Mod4+f fullscreen toggle
bindsym Mod4+t floating toggle

# Keybind HUD (Slint overlay)
bindsym Mod4+slash exec dotfield-gui --hud

# Phase 4 Utilities: Screenshots and Lockscreen
bindsym Print exec ~/.config/dotfield/scripts/screenshot.sh --area
bindsym Shift+Print exec ~/.config/dotfield/scripts/screenshot.sh --full
bindsym Mod4+Escape exec swaylock -f
