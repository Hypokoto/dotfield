# Sway Bar Fragment managed by Dotfield
# Connects Swaybar to i3status-rust with Controlled Chaos colors

bar {
    position top
    status_command i3status-rs ~/.config/i3status-rust/config.toml
    font monospace 10
    strip_workspace_numbers no

    colors {
        statusline #E8E6E3
        background #0A0A0C
        separator  #34343D

        # Class            border  backgr. text
        focused_workspace  #FFB000 #1C1C23 #E8E6E3
        active_workspace   #34343D #121216 #E8E6E3
        inactive_workspace #0A0A0C #0A0A0C #A1A1AA
        urgent_workspace   #E63946 #E63946 #E8E6E3
        binding_mode       #E63946 #1C1C23 #E8E6E3
    }
}
