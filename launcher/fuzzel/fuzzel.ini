# Dotfield Fuzzel Configuration
# Controlled Chaos Theme — Void Black · Crimson · Industrial Amber · Steel

font=JetBrainsMono Nerd Font:size=11
dpi-aware=yes
prompt="❯ "
icon-theme=Papirus-Dark
icons-enabled=yes
terminal=foot -e
width=42
lines=10
horizontal-pad=24
vertical-pad=16
inner-pad=10
layer=overlay
match-mode=fzf
exit-on-keyboard-focus-loss=yes

include=~/.config/fuzzel/colors.ini

[border]
width=2
radius=8

[key-bindings]
cancel=Escape Control+c Control+bracketleft
execute=Return KP_Enter Control+m
prev=Up Control+p Control+k
next=Down Control+n Control+j
delete-prev-word=Control+BackSpace Control+w
delete-line=Control+u
prev-page=Page_Up Control+b
next-page=Page_Down Control+f
