# Dotfield Fuzzel Configuration
# Controlled Chaos Theme — Void Black · Crimson · Industrial Amber · Steel

font=JetBrainsMono Nerd Font:size=11
dpi-aware=yes
prompt="❯ "
icon-theme=Papirus-Dark
icons-enabled=yes
terminal=foot -e
width=42
lines=10
horizontal-pad=24
vertical-pad=16
inner-pad=10
layer=overlay
match-mode=fzf
exit-on-keyboard-focus-loss=yes

[colors]
background=121216dd
text=e8e6e3ff
selection=1c1c23ff
selection-text=ffb000ff
selection-match=e63946ff
input=e8e6e3ff
match=e63946ff
prompt=ffb000ff
placeholder=8b949eff
border=34343dff

[border]
width=2
radius=8

[key-bindings]
# Unmap conflicting defaults before reassigning
delete-line-forward=none
delete-line-backward=none
cursor-left=none
cursor-right=none

cancel=Escape Control+c Control+bracketleft
execute=Return KP_Enter Control+m
prev=Up Control+p Control+k
next=Down Control+n Control+j
delete-prev-word=Control+BackSpace Control+w
delete-line=Control+u
prev-page=Page_Up Control+b
next-page=Page_Down Control+f
