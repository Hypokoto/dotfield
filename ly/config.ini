# Ly Display Manager Configuration managed by Dotfield
# Controlled Chaos Theme — Void Black · Crimson · Industrial Amber · Steel
# Target installation: /etc/ly/config.ini

# Terminal & Colors (ANSI standard mapping)
# 0: Void Black (#0A0A0C), 1: Crimson (#E63946), 2: Success Green (#7BC47F),
# 3: Industrial Amber (#FFB000), 4: Steel Blue (#8B949E), 5: Magenta, 6: Pale Amber (#FFD166), 7: Bone (#E8E6E3)
bg = 0
fg = 7
border_fg = 3
border_bg = 0
text_fg = 7
error_fg = 1
error_bg = 0

# Visual Styling & Frame
hide_borders = false
border_radius = true
hide_fkeys = false
blank_password = false
asterisk = *
margin_box_h = 2
margin_box_v = 1

# Clock Configuration
clock = %a %d %b %H:%M:%S
bigclock = false

# Performance & Latency (Zero animation overhead)
animate = false
animation = 0

# Session & User State Persistence
save = true
load = true
save_file = /etc/ly/save

# Wayland Session Detection
waylandsessions = /usr/share/wayland-sessions
xsessions = /usr/share/xsessions

# Audio / Input
numlock = false
clear_password = true

# Default Session / Inputs
default_input = login
