# Ly Display Manager Configuration managed by Dotfield
# Obsidian Mint — Cyber-Botanical Interface (60-30-10 palette)
# Target installation: /etc/ly/config.ini

# TrueColor Rendering (0xSSRRGGBB format: SS=styling, RR=red, GG=green, BB=blue)
full_color = true

# Terminal & Colors (Dotfield Cyber Synthwave: Void #000000, Cyan-Teal #14B9B5, Neon Blue #04C5F0, Danger #BE3F50)
bg = 0x00000000
fg = 0x0014B9B5
border_fg = 0x0104C5F0
error_fg = 0x01BE3F50
error_bg = 0x00000000

# Visual Styling & Box Presentation
box_title = ARCH LINUX // DOTFIELD
blank_box = true
hide_borders = false
hide_key_hints = false
hide_keyboard_locks = false
hide_version_string = false
margin_box_h = 2
margin_box_v = 1

# Clock Configuration
clock = %a %d %b %H:%M:%S
bigclock = top

# Password & Authentication
asterisk = •
clear_password = true
allow_empty_password = false

# Performance & Latency (Zero animation overhead for instant cold start)
animation = none
animation_frame_delay = 5
animation_timeout_sec = 0

# Bioluminescent Matrix Fallback (when animation = matrix is preferred)
cmatrix_fg = 0x007CD699
cmatrix_head_col = 0x01FFFFFF
cmatrix_min_codepoint = 0x21
cmatrix_max_codepoint = 0x7B

# Session & User State Persistence
save = true
service_name = ly
session_log = .local/state/ly-session.log

# Wayland / X11 Session Detection Paths
waylandsessions = /usr/share/wayland-sessions
xsessions = /usr/share/xsessions

# Input & Hardware Defaults
numlock = false
default_input = login
input_len = 34
