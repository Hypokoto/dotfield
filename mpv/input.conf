# Dotfield mpv Keybindings
# Intuitive & ergonomic media controls

# Playback
SPACE cycle pause; show-text "${?pause==yes:Paused}${?pause==no:Playing}"
k     cycle pause
q     quit
Q     quit-watch-later

# Seeking
RIGHT seek  5
LEFT  seek -5
UP    seek  30
DOWN  seek -30
Shift+RIGHT seek  60
Shift+LEFT  seek -60
.     frame-step
,     frame-back-step

# Volume & Audio
WHEEL_UP   add volume  2
WHEEL_DOWN add volume -2
+          add volume  5
-          add volume -5
m          cycle mute
a          cycle audio

# Window & Sizing
f cycle fullscreen
ESC set fullscreen no

# Speed
[ multiply speed 0.9
] multiply speed 1.1
{ multiply speed 0.5
} multiply speed 2.0
BS set speed 1.0

# Subtitles
s cycle sub
S cycle sub-visibility
j add sub-delay -0.1
J add sub-delay +0.1

# Screenshots
c screenshot
C screenshot video

# Loop
l cycle-values loop-file "inf" "no"
