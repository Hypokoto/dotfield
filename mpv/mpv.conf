# Dotfield mpv Master Configuration
# Controlled Chaos & Modern Wayland Hardware-Accelerated Video Pipeline

# --- Video Output & GPU Pipeline ---
vo=gpu-next
gpu-api=auto
gpu-context=wayland
hwdec=auto-safe
profile=gpu-hq
scale=spline36
cscale=spline36
dscale=mitchell

# --- Wayland Window & Display Management ---
keep-open=yes
autofit-larger=85%x85%
autofit-smaller=320x180
cursor-autohide=1000
cursor-autohide-fs-only=no
wayland-internal-vsync=no

# --- Audio Pipeline ---
ao=pipewire,pulse
volume=100
volume-max=150
audio-file-auto=fuzzy

# --- On-Screen Display (OSD) ---
osd-bar=yes
osd-bar-w=60.0
osd-bar-h=2.5
osd-bar-align-y=0.92
osd-font="JetBrainsMono Nerd Font"
osd-font-size=22
osd-color="#ECFDF5"
osd-border-color="#080B0B"
osd-border-size=1.5
osd-shadow-offset=1
osd-shadow-color="#00000088"
osd-duration=1500

# --- Subtitles ---
sub-auto=fuzzy
sub-font="JetBrainsMono Nerd Font"
sub-font-size=36
sub-color="#FFFFFF"
sub-border-color="#080B0B"
sub-border-size=2.0
sub-shadow-offset=1.5
sub-shadow-color="#000000AA"
sub-margin-y=36

# --- Screenshots ---
screenshot-format=png
screenshot-png-compression=8
screenshot-template="~/Pictures/Screenshots/mpv-%F-%p-%n"
screenshot-high-bit-depth=yes

# --- Cache ---
cache=yes
demuxer-max-bytes=150MiB
demuxer-max-back-bytes=50MiB
