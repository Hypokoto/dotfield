# BLACKSITE Industrial Noir styling for Tmux
# Generated by Dotfield — Void Black · Crimson · Industrial Amber · Steel

# Status bar geometry and colors
set -g status-position top
set -g status-justify left
set -g status-style "bg=#111216,fg=#8F94A6"
set -g status-left-length 50
set -g status-right-length 80

# Dynamic Prefix & Session Indicator (Visual feedback when Prefix is active)
set -g status-left "#{?client_prefix,#[bg=#E63946,fg=#08080A,bold] [SYS:PREFIX] #[bg=#111216,fg=#E63946,nobold] ,#[bg=#FFB000,fg=#08080A,bold] [SYS:#S] #[bg=#111216,fg=#FFB000,nobold] }"
set -g status-right "#[fg=#282A36]│ #[fg=#606474] %H:%M #[fg=#282A36]│ #[fg=#E6E6EB] %d-%b-%y "

# Window tab status styling
setw -g window-status-style "fg=#8F94A6,bg=#111216"
setw -g window-status-current-style "fg=#E6E6EB,bg=#181920,bold"
setw -g window-status-format " #[fg=#606474][#I // #[fg=#8F94A6]#W#{?window_zoomed_flag, 󰁌,}] "
setw -g window-status-current-format " #[fg=#FFB000,bg=#181920][#I // #[fg=#E6E6EB]#W#{?window_zoomed_flag, 󰁌,}] "
setw -g window-status-separator ""

# Pane borders (Hairline Iron & Tactical Amber)
set -g pane-border-style "fg=#282A36"
set -g pane-active-border-style "fg=#FFB000"

# Interactive prompt and messages
set -g message-style "bg=#181920,fg=#FFB000,bold"
set -g message-command-style "bg=#181920,fg=#FFD166,bold"
set -g mode-style "bg=#181920,fg=#FFD166,bold"

# Floating popup styling (Tmux 3.2+)
set -g popup-border-lines single
set -g popup-border-style "fg=#FFB000,bg=#111216"

# Clock mode
setw -g clock-mode-colour "#FFB000"
