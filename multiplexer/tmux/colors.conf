# Controlled Chaos styling for Tmux
# Generated by Dotfield — Void Black · Crimson · Industrial Amber · Steel

# Status bar geometry and colors
set -g status-position top
set -g status-justify left
set -g status-style "bg=#121216,fg=#A1A1AA"
set -g status-left-length 50
set -g status-right-length 80

# Dynamic Prefix & Session Indicator (Visual feedback when Prefix is active)
set -g status-left "#{?client_prefix,#[bg=#E63946,fg=#0A0A0C,bold]  PREFIX #[bg=#121216,fg=#E63946,nobold] ,#[bg=#FFB000,fg=#0A0A0C,bold]  #S #[bg=#121216,fg=#FFB000,nobold] }"
set -g status-right "#[fg=#34343D]│ #[fg=#8B949E] %H:%M #[fg=#34343D]│ #[fg=#E8E6E3] %d-%b-%y "

# Window tab status styling
setw -g window-status-style "fg=#A1A1AA,bg=#121216"
setw -g window-status-current-style "fg=#E8E6E3,bg=#1C1C23,bold"
setw -g window-status-format " #[fg=#8B949E]#I:#[fg=#A1A1AA]#W#{?window_zoomed_flag, 󰁌,} "
setw -g window-status-current-format " #[fg=#FFB000]#I:#[fg=#E8E6E3]#W#{?window_zoomed_flag, 󰁌,}  "
setw -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#34343D"
set -g pane-active-border-style "fg=#FFB000"

# Interactive prompt and messages
set -g message-style "bg=#1C1C23,fg=#FFB000,bold"
set -g message-command-style "bg=#1C1C23,fg=#FFD166,bold"
set -g mode-style "bg=#1C1C23,fg=#FFD166,bold"

# Floating popup styling (Tmux 3.2+)
set -g popup-border-lines single
set -g popup-border-style "fg=#FFB000,bg=#121216"

# Clock mode
setw -g clock-mode-colour "#FFB000"
