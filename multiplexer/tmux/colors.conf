# Cyber Synthwave styling for Tmux
# Generated by Dotfield — Void Black · Deep Violet · Neon Blue · Cyan-Teal

# Status bar geometry and colors
set -g status-position top
set -g status-justify left
set -g status-style "bg=#140E29,fg=#14B9B5"
set -g status-left-length 50
set -g status-right-length 80

# Dynamic Prefix & Session Indicator (Visual feedback when Prefix is active)
# Note: Inside #{?cond,A,B}, commas delimit arguments. Chained #[attr] tags prevent argument splitting.
set -g status-left "#{?client_prefix,#[bg=#BE3F50]#[fg=#000000]#[bold] [SYS:PREFIX] #[default] ,#[bg=#04C5F0]#[fg=#000000]#[bold] [SYS:#S] #[default] }"
set -g status-right "#[fg=#251B4A,bg=#140E29]│ #[fg=#11AEB3,bg=#140E29] %H:%M #[fg=#251B4A,bg=#140E29]│ #[fg=#14B9B5,bg=#140E29] %d-%b-%y "

# Window tab status styling
setw -g window-status-style "fg=#11AEB3,bg=#140E29"
setw -g window-status-current-style "fg=#FFFFFF,bg=#251B4A,bold"
setw -g window-status-format " #[fg=#11AEB3][#I // #[fg=#11AEB3]#W#{?window_zoomed_flag, 󰁌,}] "
setw -g window-status-current-format " #[fg=#04C5F0,bg=#251B4A][#I // #[fg=#FFFFFF]#W#{?window_zoomed_flag, 󰁌,}] "
setw -g window-status-separator ""

# Pane borders (Hairline Overlay & Neon Blue)
set -g pane-border-lines single
set -g pane-border-style "fg=#251B4A"
set -g pane-active-border-style "fg=#04C5F0"

# Interactive prompt and messages
set -g message-style "bg=#251B4A,fg=#04C5F0,bold"
set -g message-command-style "bg=#251B4A,fg=#04C5F0,bold"
set -g mode-style "bg=#251B4A,fg=#04C5F0,bold"

# Floating popup styling (Tmux 3.2+)
set -g popup-border-lines single
set -g popup-border-style "fg=#04C5F0,bg=#140E29"

# Clock mode
setw -g clock-mode-colour "#04C5F0"
