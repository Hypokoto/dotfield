# Obsidian Mint styling for Tmux
# Generated by Dotfield — Obsidian · Mint · Emerald · Steel

# Status bar geometry and colors
set -g status-position top
set -g status-justify left
set -g status-style "bg=#0E1413,fg=#94A3A0"
set -g status-left-length 50
set -g status-right-length 80

# Dynamic Prefix & Session Indicator (Visual feedback when Prefix is active)
# Note: Inside #{?cond,A,B}, commas delimit arguments. Chained #[attr] tags prevent argument splitting.
set -g status-left "#{?client_prefix,#[bg=#F43F5E]#[fg=#080B0B]#[bold] [SYS:PREFIX] #[default] ,#[bg=#2DD4BF]#[fg=#080B0B]#[bold] [SYS:#S] #[default] }"
set -g status-right "#[fg=#23322F,bg=#0E1413]│ #[fg=#71827E,bg=#0E1413] %H:%M #[fg=#23322F,bg=#0E1413]│ #[fg=#ECFDF5,bg=#0E1413] %d-%b-%y "

# Window tab status styling
setw -g window-status-style "fg=#94A3A0,bg=#0E1413"
setw -g window-status-current-style "fg=#ECFDF5,bg=#16201E,bold"
setw -g window-status-format " #[fg=#71827E][#I // #[fg=#94A3A0]#W#{?window_zoomed_flag, 󰁌,}] "
setw -g window-status-current-format " #[fg=#2DD4BF,bg=#16201E][#I // #[fg=#ECFDF5]#W#{?window_zoomed_flag, 󰁌,}] "
setw -g window-status-separator ""

# Pane borders (Hairline Iron & Bioluminescent Mint)
set -g pane-border-lines single
set -g pane-border-style "fg=#23322F"
set -g pane-active-border-style "fg=#2DD4BF"

# Interactive prompt and messages
set -g message-style "bg=#16201E,fg=#2DD4BF,bold"
set -g message-command-style "bg=#16201E,fg=#2DD4BF,bold"
set -g mode-style "bg=#16201E,fg=#2DD4BF,bold"

# Floating popup styling (Tmux 3.2+)
set -g popup-border-lines single
set -g popup-border-style "fg=#2DD4BF,bg=#0E1413"

# Clock mode
setw -g clock-mode-colour "#2DD4BF"
