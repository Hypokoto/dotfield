# Tmux configuration managed by Dotfield
# Controlled Chaos Theme — Void Black · Crimson · Industrial Amber · Steel

### Prefix Key
unbind C-b
set -g prefix C-a
bind C-a send-prefix

### Low-Latency & Editor Synchronization (Zero Escape Lag)
set -s escape-time 0
set -g repeat-time 300
set -g focus-events on
set -g history-limit 50000

### Terminal Capabilities & TrueColor
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m' # underscore colors

### Window & Pane Indexing (1-based for keyboard ergonomics)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g automatic-rename on
set -g mouse on

### Vi-Mode Keybindings & Wayland Clipboard
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Escape send -X cancel
bind p run "wl-paste -n | tmux load-buffer - ; tmux paste-buffer"

### Intuitive Pane Splits (Retaining Working Directory)
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

### Vim Pane Navigation & Resizing
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 4
bind -r J resize-pane -D 4
bind -r K resize-pane -U 4
bind -r L resize-pane -R 4

### Fast Configuration Reload
bind r source-file ~/.config/tmux/tmux.conf \; display-message "✔ Tmux configuration reloaded"

### Source Controlled Chaos Dynamic Palette
source-file ~/.config/tmux/colors.conf
