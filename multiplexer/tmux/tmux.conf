# Tmux configuration managed by Dotfield
# Controlled Chaos Theme — Void Black · Crimson · Industrial Amber · Steel
# High-performance, low-latency multiplexer harmonized with Zellij & Neovim

### 1. Prefix Key
unbind C-b
set -g prefix C-a
bind C-a send-prefix

### 2. Low-Latency & Editor Synchronization (Zero Escape Lag)
set -s escape-time 0
set -g repeat-time 300
set -g focus-events on
set -g history-limit 50000

### 3. Terminal Capabilities & TrueColor
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m' # underscore colors

### 4. Window & Pane Indexing (1-based for keyboard ergonomics)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g automatic-rename on
set -g mouse on

### 5. Vi-Mode Keybindings & Wayland Clipboard
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Escape send -X cancel
bind p run "wl-paste -n | tmux load-buffer - ; tmux paste-buffer"

### 6. Harmonized Alt Navigation (Identical to Zellij & Zero Neovim Collision)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -n M-n split-window -c "#{pane_current_path}"
bind -n M-t new-window -c "#{pane_current_path}"
bind -n M-w kill-pane
bind -n M-z resize-pane -Z
bind -n M-[ previous-window
bind -n M-] next-window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

### 7. Intuitive Pane Splits (Retaining Working Directory)
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind x kill-pane
bind X kill-window

### 8. Vim Pane Navigation, Swapping & Resizing
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 4
bind -r J resize-pane -D 4
bind -r K resize-pane -U 4
bind -r L resize-pane -R 4

bind > swap-pane -D
bind < swap-pane -U
bind BSpace last-window
bind Tab last-pane

### 9. Interactive Session & Window Pickers
bind S choose-tree -sZ
bind W choose-tree -wZ

### 10. Modern Floating Popups (Tmux 3.2+)
bind f display-popup -d "#{pane_current_path}" -w 80% -h 80% -E ""
bind g display-popup -d "#{pane_current_path}" -w 85% -h 85% -E "command -v lazygit >/dev/null 2>&1 && lazygit || git status; read -n 1 -s -r -p 'Press any key to close...'"
bind b display-popup -d "#{pane_current_path}" -w 85% -h 85% -E "command -v btop >/dev/null 2>&1 && btop || top"

### 11. Configuration Reload
bind r source-file ~/.config/tmux/tmux.conf \; display-message "✔ Tmux configuration reloaded"

### 12. Source Controlled Chaos Dynamic Palette
source-file ~/.config/tmux/colors.conf
