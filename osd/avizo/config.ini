# Avizo OSD Configuration managed by Dotfield
# Obsidian Mint — Tactical Interface

[default]
# Time to display the notification in seconds
time = 2.0

# Position on screen (fraction of screen height from top)
y-offset = 0.85

# Dimensions
width = 240
height = 180
padding = 16

# Borders & Radii (1px hairline border, 4px subtle radius)
border-width = 1
border-radius = 4

# Colors
border-color = #2DD4BF
background-color = #080B0Bf2
bar-bg-color = #16201E
bar-fg-color = #2DD4BF

# Typography
font = "JetBrainsMono Nerd Font 11"
