# Dotfield Default Rice Profile
# Balanced daily-driver configuration

[meta]
name = "default"
description = "Balanced daily-driver Wayland workstation with Controlled Chaos aesthetics"
version = "1.0.0"

[compositor]
engine = "sway"
scaling = 1.0

[apps]
terminal = "foot"
launcher = "fuzzel"
editor = "nvim"
multiplexer = "zellij"
notifications = "mako"
bar = "i3status-rs"

[theme]
palette = "controlled-chaos"
font_family = "monospace"
font_size = 11

[bindings]
terminal = "Super+Return"
launcher = "Super+space"
app_menu = "Super+Shift+space"
close_window = "Super+q"
fullscreen = "Super+f"
hud = "Super+slash"
screenshot_area = "Print"
screenshot_full = "Shift+Print"
lock = "Super+Escape"

[security]
firejail = false
flatpak_overrides = true
nftables = true
apparmor = true
