# Dotfield Hardened Rice Profile
# Maximum security, network isolation, and sandbox boundaries

[meta]
name = "hardening"
description = "Hardened security posture with Firejail sandboxing, AppArmor, and NFTables packet filtering"
version = "1.0.0"

[compositor]
engine = "sway"
scaling = 1.0

[apps]
terminal = "~/.config/dotfield/scripts/terminal-select.sh"
launcher = "fuzzel"
editor = "nvim"
multiplexer = "zellij"
notifications = "mako"
bar = "i3status-rs"

[theme]
palette = "controlled-chaos"
font_family = "monospace"
font_size = 11

[bindings]
terminal = "Super+Return"
launcher = "Super+space"
app_menu = "Super+Shift+space"
close_window = "Super+q"
fullscreen = "Super+f"
hud = "Super+slash"
screenshot_area = "Print"
screenshot_full = "Shift+Print"
lock = "Super+Escape"

[security]
firejail = true
firejail_profile = "security/firejail/browser.profile"
flatpak_overrides = true
nftables = true
nftables_ruleset = "security/nft/workstation.nft"
apparmor = true
apparmor_profile = "security/apparmor/dotfield-daemon"
