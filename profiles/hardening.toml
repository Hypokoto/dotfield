[meta]
name = "hardening"
description = "Hardened security profile with network and application isolation"
version = "0.1.0"

[compositor]
target = "sway"
gaps_inner = 4
gaps_outer = 4
border_width = 2

[apps]
terminal = "foot"
launcher = "fuzzel"
editor = "nvim"
multiplexer = "zellij"
file_manager = "foot -e yazi"
browser = "firejail firefox"
bar = "i3status-rust"
notifications = "mako"

[bindings]
terminal = "Super+Return"
launcher = "Super+space"
editor = "Super+e"
close_window = "Super+q"
toggle_floating = "Super+Shift+space"
fullscreen = "Super+f"
reload_config = "Super+Shift+r"

[theme]
palette = "nord-dark"
font_sans = "Inter 10"
font_mono = "JetBrainsMono Nerd Font 10"
accent_color = "#88c0d0"
background = "#2e3440"
foreground = "#eceff4"

[security]
isolate_browser = true
enforce_firejail = true
enforce_nftables = true
enforce_apparmor = true
