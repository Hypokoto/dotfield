[meta]
name = "minimal"
description = "Minimalist lightweight rice for maximum performance"
version = "0.1.0"

[compositor]
target = "sway"
gaps_inner = 0
gaps_outer = 0
border_width = 1

[apps]
terminal = "foot"
launcher = "fuzzel"
editor = "nvim"
multiplexer = "tmux"
file_manager = "foot -e lf"
browser = "firefox"
bar = "swaybar"
notifications = "mako"

[bindings]
terminal = "Super+Return"
launcher = "Super+space"
editor = "Super+e"
close_window = "Super+q"
toggle_floating = "Super+Shift+space"
fullscreen = "Super+f"
reload_config = "Super+Shift+r"

[theme]
palette = "monochrome"
font_sans = "monospace 10"
font_mono = "monospace 10"
accent_color = "#ffffff"
background = "#000000"
foreground = "#e0e0e0"

[security]
isolate_browser = false
enforce_firejail = false
enforce_nftables = false
