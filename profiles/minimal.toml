# Dotfield Minimal Rice Profile
# Ultra-lightweight resource footprint

[meta]
name = "minimal"
description = "Lean, scrollable-tiling Wayland workstation using Niri and minimal daemons"
version = "1.0.0"

[compositor]
engine = "niri"
scaling = 1.0

[apps]
terminal = "foot"
launcher = "fuzzel"
editor = "nvim"
multiplexer = "tmux"
notifications = "mako"
bar = "none"

[theme]
palette = "controlled-chaos"
font_family = "monospace"
font_size = 11

[bindings]
terminal = "Super+Return"
launcher = "Super+space"
app_menu = "Super+Shift+space"
close_window = "Super+q"
fullscreen = "Super+f"
hud = "Super+slash"
screenshot_area = "Print"
screenshot_full = "Shift+Print"
lock = "Super+Escape"

[security]
firejail = false
flatpak_overrides = true
nftables = false
apparmor = false
