# Flatpak declarative override declarations
# Managed by Dotfield

[global]
# Enforce native Wayland and deny legacy display, audio, and credential sockets.
socket = ["wayland", "!x11", "!fallback-x11", "!pulseaudio", "!ssh-auth", "!gpg-agent", "!pcsc", "!cups"]

# Deny broad host and document-provider access by default.
filesystem = ["!home", "!host", "!host-os", "!host-etc", "!xdg-run/gvfs"]

[browser]
# Sandboxed browser profile: downloads and GPU rendering only.
socket = ["wayland", "!x11", "!fallback-x11", "!pulseaudio", "!ssh-auth", "!gpg-agent", "!pcsc", "!cups"]
filesystem = ["xdg-download:rw", "!home", "!host", "!host-os", "!host-etc", "!xdg-run/gvfs"]
device = ["dri"]
