# Flatpak declarative override declarations
# Managed by Dotfield

[global]
# Enforce native Wayland display and disable X11 socket sharing
socket = ["wayland", "!x11", "!fallback-x11"]

# Deny global filesystem snooping by default
filesystem = ["!home", "!host"]

[browser]
# Sandboxed browser profile overrides
filesystem = ["xdg-download:rw"]
device = ["dri"]
socket = ["wayland"]
