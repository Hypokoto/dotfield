[bar]
enabled = true
height = 48.0
position = "bottom"
show_workspaces = true
show_title = true
show_telemetry = true

[theme]
font_family = "IBM Plex Sans"
font_size = 11.5
style = "cyber-synthwave"

[palette]
background = "#000000"
surface = "#140e29"
overlay = "#251b4a"
muted = "#ABA5DB"
accent = "#04C5F0"
highlight = "#FF7F41"
foreground = "#EAF8FA"
border = "#342766"
hover = "#97DCE3"
steel = "#ffbe74"
success = "#7cd699"
danger_critical = "#CE4F48"

[widgets]
enabled = true
board_enabled = true
grid_columns = 2

[[widgets.items]]
kind = "focus_shield"
size = "2x1"
enabled = true

[[widgets.items]]
kind = "telemetry"
size = "2x1"
enabled = true

[[widgets.items]]
kind = "workspaces"
size = "2x1"
enabled = true

# Optional modules implemented in cards.rs (uncomment to enable):
# [[widgets.items]]
# kind = "media"
# size = "2x1"
# enabled = true
#
# [[widgets.items]]
# kind = "clock"
# size = "1x1"
# enabled = true
#
# [[widgets.items]]
# kind = "notifications"
# size = "2x1"
# enabled = true

[osd]
enabled = true
timeout_ms = 1200

[notifications]
enabled = true
timeout_ms = 5000
max_visible = 5

[launcher]
enabled = true
max_results = 8

[control_center]
enabled = true
show_mpris = true
show_network = true
show_bluetooth = true

[terminal]
default = "ghostty"
