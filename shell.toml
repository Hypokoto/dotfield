[theme]
font_family = "Inter"
font_size = 10.0
style = "cyber-synthwave"

[palette]
background = "#000000"
surface = "#140e29"
overlay = "#251b4a"
muted = "#ffbe74"
accent = "#04C5F0"
highlight = "#FF7F41"
foreground = "#14B9B5"
border = "#251b4a"
hover = "#11AEB3"
steel = "#ffbe74"
success = "#7cd699"
danger_critical = "#CE4F48"

[bar]
enabled = true
height = 32.0
position = "top"
show_workspaces = true
show_title = true
show_telemetry = true

[osd]
enabled = true
timeout_ms = 1200

[notifications]
enabled = true
timeout_ms = 5000
max_visible = 5

[launcher]
enabled = true
max_results = 8

[control_center]
enabled = true
show_mpris = true
show_network = true
show_bluetooth = true

[terminal]
default = "ghostty"
