# Dotfield Starship Prompt Configuration
# Obsidian Mint Specification — Void · Mint · Emerald · Amber Gold · Rose Critical

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$rust\
$python\
$nodejs\
$golang\
$docker_context\
$cmd_duration\
$status\
$jobs\
$line_break\
$character"""

scan_timeout = 250
command_timeout = 500

palette = "obsidian_mint"

[palettes.obsidian_mint]
void = "#080B0B"
obsidian = "#0E1413"
graphite = "#16201E"
iron = "#23322F"
ash = "#94A3A0"
bone = "#ECFDF5"
crimson = "#F43F5E"
blood_red = "#9F1239"
amber = "#FBBF24"
mint = "#2DD4BF"
emerald = "#10B981"
steel = "#71827E"
green = "#10B981"
blue = "#38BDF8"

[character]
success_symbol = "[❯](bold mint)"
error_symbol = "[❯](bold crimson)"
vimcmd_symbol = "[❮](bold mint)"
vimcmd_replace_symbol = "[❮](bold crimson)"
vimcmd_replace_one_symbol = "[❮](bold crimson)"
vimcmd_visual_symbol = "[❮](bold amber)"

[directory]
style = "bold mint"
truncation_length = 3
truncate_to_repo = true
read_only = " 󰌾"

[git_branch]
symbol = " "
style = "bold ash"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold crimson"
format = "([\\[$all_status$ahead_behind\\]]($style) )"
ignore_submodules = true

[package]
disabled = true

[git_state]
style = "bold amber"
format = "[$state( $progress_current/$progress_total)]($style) "

[rust]
symbol = "󱘗 "
style = "bold mint"
format = "[$symbol($version )]($style)"

[python]
symbol = "󰌠 "
style = "bold amber"
format = "[$symbol($version )]($style)"

[nodejs]
symbol = "󰌞 "
style = "bold emerald"
format = "[$symbol($version )]($style)"

[golang]
symbol = "󰟓 "
style = "bold blue"
format = "[$symbol($version )]($style)"

[docker_context]
symbol = "󰡨 "
style = "bold steel"
format = "[$symbol$context]($style) "

[cmd_duration]
min_time = 1_000
style = "bold steel"
format = "[$duration]($style) "

[status]
disabled = false
style = "bold crimson"
symbol = "✘ "
format = "[$symbol$status]($style) "

[jobs]
symbol = "󰔚 "
style = "bold amber"
format = "[$symbol$number]($style) "

[line_break]
disabled = false
