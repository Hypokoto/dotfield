# Dotfield Starship Prompt Configuration
# BLACKSITE Specification — Void Black · Industrial Amber · Crimson · Steel

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$rust\
$python\
$nodejs\
$golang\
$docker_context\
$cmd_duration\
$status\
$jobs\
$line_break\
$character"""

scan_timeout = 250
command_timeout = 500

palette = "blacksite"

[palettes.blacksite]
void = "#08080A"
obsidian = "#111216"
graphite = "#181920"
iron = "#282A36"
ash = "#8F94A6"
bone = "#E6E6EB"
crimson = "#E63946"
blood_red = "#9D0208"
amber = "#FFB000"
pale_amber = "#FFD166"
steel = "#606474"
green = "#4AF626"
blue = "#4C78A8"

[character]
success_symbol = "[❯](bold amber)"
error_symbol = "[❯](bold crimson)"
vimcmd_symbol = "[❮](bold amber)"
vimcmd_replace_symbol = "[❮](bold crimson)"
vimcmd_replace_one_symbol = "[❮](bold crimson)"
vimcmd_visual_symbol = "[❮](bold pale_amber)"

[directory]
style = "bold amber"
truncation_length = 3
truncate_to_repo = true
read_only = " 󰌾"

[git_branch]
symbol = " "
style = "bold ash"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold crimson"
format = "([\\[$all_status$ahead_behind\\]]($style) )"
ignore_submodules = true

[package]
disabled = true

[git_state]
style = "bold amber"
format = "[$state( $progress_current/$progress_total)]($style) "

[rust]
symbol = "󱘗 "
style = "bold crimson"
format = "[$symbol($version )]($style)"

[python]
symbol = "󰌠 "
style = "bold amber"
format = "[$symbol($version )]($style)"

[nodejs]
symbol = "󰌞 "
style = "bold green"
format = "[$symbol($version )]($style)"

[golang]
symbol = "󰟓 "
style = "bold blue"
format = "[$symbol($version )]($style)"

[docker_context]
symbol = "󰡨 "
style = "bold steel"
format = "[$symbol$context]($style) "

[cmd_duration]
min_time = 1_000
style = "bold steel"
format = "[$duration]($style) "

[status]
disabled = false
style = "bold crimson"
symbol = "✘ "
format = "[$symbol$status]($style) "

[jobs]
symbol = "󰔚 "
style = "bold pale_amber"
format = "[$symbol$number]($style) "

[line_break]
disabled = false
