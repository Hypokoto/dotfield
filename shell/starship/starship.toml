# Dotfield Starship Prompt Configuration
# Controlled Chaos Theme — Void Black · Crimson · Industrial Amber · Steel

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$rust\
$python\
$nodejs\
$golang\
$docker_context\
$cmd_duration\
$jobs\
$line_break\
$character"""

scan_timeout = 250
command_timeout = 500

palette = "controlled_chaos"

[palettes.controlled_chaos]
void = "#0A0A0C"
obsidian = "#121216"
graphite = "#1C1C23"
iron = "#34343D"
ash = "#A1A1AA"
bone = "#E8E6E3"
crimson = "#E63946"
amber = "#FFB000"
pale_amber = "#FFD166"
steel = "#8B949E"
green = "#7BC47F"
blue = "#82AAFF"

[character]
success_symbol = "[❯](bold amber)"
error_symbol = "[❯](bold crimson)"
vimcmd_symbol = "[❮](bold amber)"
vimcmd_replace_symbol = "[❮](bold crimson)"
vimcmd_replace_one_symbol = "[❮](bold crimson)"
vimcmd_visual_symbol = "[❮](bold pale_amber)"

[directory]
style = "bold amber"
truncation_length = 3
truncate_to_repo = true
read_only = " 󰌾"

[git_branch]
symbol = " "
style = "bold ash"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold crimson"
format = "([\\[$all_status$ahead_behind\\]]($style) )"
ignore_submodules = true

[package]
disabled = true

[git_state]
style = "bold amber"
format = "[$state( $progress_current/$progress_total)]($style) "

[rust]
symbol = "󱘗 "
style = "bold crimson"
format = "[$symbol($version )]($style)"

[python]
symbol = "󰌠 "
style = "bold amber"
format = "[$symbol($version )]($style)"

[nodejs]
symbol = "󰌞 "
style = "bold green"
format = "[$symbol($version )]($style)"

[golang]
symbol = "󰟓 "
style = "bold blue"
format = "[$symbol($version )]($style)"

[docker_context]
symbol = "󰡨 "
style = "bold steel"
format = "[$symbol$context]($style) "

[cmd_duration]
min_time = 2_000
style = "bold steel"
format = "[$duration]($style) "

[jobs]
symbol = "󰔚 "
style = "bold pale_amber"
format = "[$symbol$number]($style) "

[line_break]
disabled = false
