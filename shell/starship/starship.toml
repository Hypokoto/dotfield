# Dotfield Starship Prompt Configuration
# Cyber Synthwave Specification — Void · Deep Violet · Cyan-Teal · Neon Blue · Purple · Emerald

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$rust\
$python\
$nodejs\
$golang\
$docker_context\
$cmd_duration\
$status\
$jobs\
$line_break\
$character"""

scan_timeout = 250
command_timeout = 500

palette = "cyber_synthwave"

[palettes.cyber_synthwave]
void = "#000000"
surface = "#140e29"
overlay = "#251b4a"
ash = "#11AEB3"
bone = "#14B9B5"
crimson = "#BE3F50"
blood_red = "#CE4F48"
amber = "#FF7F41"
peach = "#ffbe74"
cyan = "#14B9B5"
blue = "#04C5F0"
purple = "#9147a8"
emerald = "#7cd699"
steel = "#11AEB3"
mint = "#04C5F0"
green = "#7cd699"

[character]
success_symbol = "[❯](bold mint)"
error_symbol = "[❯](bold crimson)"
vimcmd_symbol = "[❮](bold mint)"
vimcmd_replace_symbol = "[❮](bold crimson)"
vimcmd_replace_one_symbol = "[❮](bold crimson)"
vimcmd_visual_symbol = "[❮](bold amber)"

[directory]
style = "bold mint"
truncation_length = 3
truncate_to_repo = true
read_only = " 󰌾"

[git_branch]
symbol = " "
style = "bold ash"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold crimson"
format = "([\\[$all_status$ahead_behind\\]]($style) )"
ignore_submodules = true

[package]
disabled = true

[git_state]
style = "bold amber"
format = "[$state( $progress_current/$progress_total)]($style) "

[rust]
symbol = "󱘗 "
style = "bold mint"
format = "[$symbol($version )]($style)"

[python]
symbol = "󰌠 "
style = "bold amber"
format = "[$symbol($version )]($style)"

[nodejs]
symbol = "󰌞 "
style = "bold emerald"
format = "[$symbol($version )]($style)"

[golang]
symbol = "󰟓 "
style = "bold blue"
format = "[$symbol($version )]($style)"

[docker_context]
symbol = "󰡨 "
style = "bold steel"
format = "[$symbol$context]($style) "

[cmd_duration]
min_time = 1_000
style = "bold steel"
format = "[$duration]($style) "

[status]
disabled = false
style = "bold crimson"
symbol = "✘ "
format = "[$symbol$status]($style) "

[jobs]
symbol = "󰔚 "
style = "bold amber"
format = "[$symbol$number]($style) "

[line_break]
disabled = false
