# Alacritty Configuration — Managed by Dotfield
# Controlled Chaos Theme — Void Black · Crimson · Industrial Amber · Steel
# Architecture: Minimalist GPU Acceleration · Pure Native Search · Tmux Recommended

[general]
import = ["~/.config/alacritty/colors.toml"]
live_config_reload = true

[env]
TERM = "alacritty"

[window]
padding = { x = 12, y = 12 }
dynamic_padding = false
opacity = 1.0
decorations = "None"
startup_mode = "Windowed"

[scrolling]
history = 10000
multiplier = 3

[font]
size = 11.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[cursor]
style = { shape = "Block", blinking = "Never" }
unfocused_hollow = true
thickness = 0.15

[mouse]
hide_when_typing = true

[selection]
save_to_clipboard = true
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"

[bell]
animation = "EaseOutExpo"
duration = 0

[hints]
alphabet = "jfkdlsauriehtnvx"

[[hints.enabled]]
regex = "(https?://|git@|git://|ssh://|ftp://)[^\\u0000-\\u001F\\u007F-\\u009F<>\"\\\\s{-}\\\\^⟨⟩`]+"
command = "xdg-open"
post_processing = true
mouse = { enabled = true }
binding = { key = "U", mods = "Control|Shift" }

[keyboard]
bindings = [
  # Clipboard
  { key = "C", mods = "Control|Shift", action = "Copy" },
  { key = "V", mods = "Control|Shift", action = "Paste" },

  # Font sizing
  { key = "Plus", mods = "Control", action = "IncreaseFontSize" },
  { key = "Minus", mods = "Control", action = "DecreaseFontSize" },
  { key = "Key0", mods = "Control", action = "ResetFontSize" },

  # Pure Native Vi Mode & Search
  { key = "Space", mods = "Control|Shift", action = "ToggleViMode" },
  { key = "F", mods = "Control|Shift", action = "SearchForward" },
  { key = "B", mods = "Control|Shift", action = "SearchBackward" },

  # Window Spawn (Alt-based)
  { key = "Return", mods = "Alt", action = "SpawnNewInstance" },

  # Scrollback Navigation
  { key = "PageUp", mods = "Shift", action = "ScrollPageUp" },
  { key = "PageDown", mods = "Shift", action = "ScrollPageDown" },
  { key = "Home", mods = "Shift", action = "ScrollToTop" },
  { key = "End", mods = "Shift", action = "ScrollToBottom" }
]
