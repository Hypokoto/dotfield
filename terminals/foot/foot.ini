# -*- conf -*-
# Foot configuration managed by Dotfield
# Controlled Chaos Theme — Void Black · Crimson · Industrial Amber · Steel

# Load theme colors dynamically from fragment
include=~/.config/foot/colors.ini

font=JetBrainsMono Nerd Font:size=11
initial-window-size-chars=120x34
pad=12x12
term=foot
box-drawings-uses-font-glyphs=yes
gamma-correct-blending=no
scrollback-lines=10000
underline-offset=2

[url]
launch=xdg-open ${url}
protocols=http, https, ftp, ftps, file, gemini, gopher
underline-when-target=yes

[cursor]
style=block
blink=no

[mouse]
hide-when-typing=yes

[bell]
urgent=yes
notify=no

[key-bindings]
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
search-start=Control+Shift+r
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0
