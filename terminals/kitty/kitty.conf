# Kitty configuration managed by Dotfield
# Remote control enabled for zero-restart live reload
# Controlled Chaos Theme — Void Black · Crimson · Industrial Amber · Steel

allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/kitty-dotfield.sock

# Typography
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0
window_padding_width 12

# Cursor & Bell
cursor_shape block
cursor_blink_interval 0
enable_audio_bell no
visual_bell_duration 0.0

# Scrollback & Mouse
scrollback_lines 10000
wheel_scroll_multiplier 3.0
mouse_hide_wait 3.0

# URL Handling
url_color #FFB000
url_style curly
open_url_with default

# Tab Bar Presentation (Controlled Chaos Powerline)
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{index}: {title}"
active_tab_foreground   #E8E6E3
active_tab_background   #1C1C23
active_tab_font_style   bold
inactive_tab_foreground #A1A1AA
inactive_tab_background #0A0A0C
inactive_tab_font_style normal
tab_bar_background      #0A0A0C

# Low-Latency Rendering & Direct GPU Push
repaint_delay 6
input_delay 1
sync_to_monitor yes
wayland_enable_ime no

# Keybindings
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0

# Dynamic color fragment include
include colors.conf
