# Kitty Configuration — Managed by Dotfield
# Controlled Chaos Theme — Void Black · Crimson · Industrial Amber · Steel
# Architecture: Direct GPU Push · Pure Native Search · Alt-based Navigation

# --- Remote Control & IPC Security ---
allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/kitty-dotfield.sock

# --- Typography & Font Rendering ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0
disable_ligatures never
box_drawing_scale 0.001, 1, 1.5, 2
undercurl_style  curly

# --- Window Geometry & Decorations ---
window_padding_width 12
placement_strategy center
hide_window_decorations yes
confirm_os_window_close 0
remember_window_size no
initial_window_width 100c
initial_window_height 30c

# --- Background & Opacity ---
background_opacity 1.0
dynamic_background_opacity no

# --- Tab Bar Presentation (Controlled Chaos Powerline) ---
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{index}: {title}"
active_tab_foreground   #E8E6E3
active_tab_background   #1C1C23
active_tab_font_style   bold
inactive_tab_foreground #A1A1AA
inactive_tab_background #0A0A0C
inactive_tab_font_style normal
tab_bar_background      #0A0A0C

# --- Layouts & Splits ---
enabled_layouts splits,stack,fat,tall

# --- Cursor & Bell ---
cursor #FFB000
cursor_text_color #0A0A0C
cursor_shape block
cursor_blink_interval 0
enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell yes

# --- Scrollback & Pure Native Search ---
scrollback_lines 10000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
wheel_scroll_multiplier 3.0
wheel_scroll_min_lines 1

# --- Mouse & Hyperlinks ---
mouse_hide_wait 3.0
url_color #FFB000
url_style curly
open_url_with default
copy_on_select no
strip_trailing_spaces smart

# --- Low-Latency Rendering & Direct GPU Push ---
repaint_delay 6
input_delay 1
sync_to_monitor yes
wayland_enable_ime no

# --- Shell Integration ---
shell_integration enabled

# --- Keybindings: Clipboard & Font Management ---
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+equal change_font_size all +1.0
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# --- Keybindings: Native Tabs (Alt-based) ---
map alt+t new_tab
map alt+w close_window
map alt+] next_tab
map alt+[ previous_tab
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5

# --- Keybindings: Native Splits (Alt-based) ---
map alt+enter launch --location=vsplit --cwd=current
map alt+shift+enter launch --location=hsplit --cwd=current
map alt+h neighboring_window left
map alt+l neighboring_window right
map alt+k neighboring_window up
map alt+j neighboring_window down
map alt+z toggle_layout stack

# --- Keybindings: Native Scrollback Search ---
map alt+s show_scrollback
map alt+f show_scrollback

# --- Color Scheme Include ---
include colors.conf
