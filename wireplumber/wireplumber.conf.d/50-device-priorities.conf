# Dotfield WirePlumber 0.5 Device Priority & Auto-Switch Configuration
# Priority Hierarchy: Bluetooth (2000) > USB Audio (1700) > HDMI/DP External Display (1500) > Internal Laptop Speakers (1009)

monitor.alsa.rules = [
  # Boost HDMI / DisplayPort Audio Output above internal speakers so external monitor audio is prioritized on connect
  {
    matches = [
      {
        node.name = "~alsa_output.*hdmi.*"
      }
      {
        node.name = "~alsa_output.*HDMI.*"
      }
      {
        node.name = "~alsa_output.*DisplayPort.*"
      }
    ]
    actions = {
      update-props = {
        priority.session = 1500
        priority.driver  = 1500
      }
    }
  },
  # Boost USB External Soundcards / DACs / Speakers
  {
    matches = [
      {
        node.name = "~alsa_output.usb.*"
      }
    ]
    actions = {
      update-props = {
        priority.session = 1700
        priority.driver  = 1700
      }
    }
  }
]
