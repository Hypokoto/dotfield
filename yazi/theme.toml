# Dotfield Yazi Theme Configuration
# Obsidian Mint (Void #080B0B, Graphite #16201E, Mint #2DD4BF, Emerald #10B981, Rose #F43F5E)

[mgr]
cwd = { fg = "#2dd4bf", bold = true }
hovered = { bg = "#16201e", bold = true }
preview_hovered = { underline = true }

# Search and Marker
find_keyword = { fg = "#fbbf24", italic = true }
find_position = { fg = "#f43f5e", bold = true }
marker_copied = { fg = "#10b981", bg = "#10b981" }
marker_cut = { fg = "#f43f5e", bg = "#f43f5e" }
marker_marked = { fg = "#2dd4bf", bg = "#2dd4bf" }
marker_selected = { fg = "#fbbf24", bg = "#fbbf24" }

# Tabs
tab_active = { fg = "#080b0b", bg = "#2dd4bf", bold = true }
tab_inactive = { fg = "#71827e", bg = "#0e1413" }
count_copied = { fg = "#080b0b", bg = "#10b981" }
count_cut = { fg = "#080b0b", bg = "#f43f5e" }
count_selected = { fg = "#080b0b", bg = "#fbbf24" }

# Border
border_symbol = "│"
border_style = { fg = "#23322f" }

[status]
separator_open = ""
separator_close = ""
separator_style = { fg = "#16201e", bg = "#16201e" }

mode_normal = { fg = "#080b0b", bg = "#2dd4bf", bold = true }
mode_select = { fg = "#080b0b", bg = "#fbbf24", bold = true }
mode_unset = { fg = "#080b0b", bg = "#f43f5e", bold = true }

progress_label = { bold = true }
progress_normal = { fg = "#2dd4bf", bg = "#0e1413" }
progress_error = { fg = "#f43f5e", bg = "#0e1413" }

permissions_t = { fg = "#2dd4bf" }
permissions_r = { fg = "#fbbf24" }
permissions_w = { fg = "#f43f5e" }
permissions_x = { fg = "#10b981" }
permissions_s = { fg = "#71827e" }

[select]
border = { fg = "#2dd4bf" }
active = { fg = "#fbbf24", bold = true }
inactive = { fg = "#ecfdf5" }

[input]
border = { fg = "#2dd4bf" }
title = { fg = "#ecfdf5" }
value = { fg = "#ecfdf5" }
selected = { bg = "#16201e" }

[completion]
border = { fg = "#23322f" }
active = { bg = "#16201e", fg = "#2dd4bf" }
inactive = { fg = "#ecfdf5" }

[tasks]
border = { fg = "#23322f" }
title = { fg = "#2dd4bf" }
hovered = { underline = true }

[which]
cols = 3
mask = { bg = "#080b0b" }
cand = { fg = "#2dd4bf" }
rest = { fg = "#71827e" }
desc = { fg = "#ecfdf5" }
separator = "  "
separator_style = { fg = "#23322f" }

[help]
on = { fg = "#2dd4bf" }
exec = { fg = "#71827e" }
desc = { fg = "#ecfdf5" }
hovered = { bg = "#16201e", bold = true }
footer = { fg = "#080b0b", bg = "#2dd4bf" }

[filetype]
rules = [
    # Media
    { mime = "image/*", fg = "#c084fc" },
    { mime = "video/*", fg = "#fb7185" },
    { mime = "audio/*", fg = "#fbbf24" },
    # Archives
    { mime = "application/*zip", fg = "#2dd4bf" },
    { mime = "application/x-tar", fg = "#2dd4bf" },
    { mime = "application/x-bzip2", fg = "#2dd4bf" },
    { mime = "application/x-7z-compressed", fg = "#2dd4bf" },
    { mime = "application/x-rar", fg = "#2dd4bf" },
    # Code & Configs
    { url = "*.rs", fg = "#2dd4bf" },
    { url = "*.kdl", fg = "#2dd4bf" },
    { url = "*.toml", fg = "#fbbf24" },
    { url = "*.json", fg = "#fbbf24" },
    { url = "*.sh", fg = "#10b981" },
    { url = "*.zsh", fg = "#10b981" },
    { url = "*.md", fg = "#94a3a0" },
    # Directories
    { url = "*/", fg = "#2dd4bf", bold = true },
]
