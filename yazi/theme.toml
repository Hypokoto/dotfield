# Dotfield Yazi Theme Configuration
# Cyber Synthwave (Void #000000, Surface #140E29, Overlay #251B4A, Foreground #14B9B5, Blue #04C5F0, Green #7CD699, Red #BE3F50)

[flavor]
dark  = "dotfield-live"
light = "dotfield-live"

[mgr]
cwd = { fg = "#04c5f0", bold = true }
hovered = { bg = "#251b4a", bold = true }
preview_hovered = { underline = true }

# Search and Marker
find_keyword = { fg = "#ff7f41", italic = true }
find_position = { fg = "#be3f50", bold = true }
marker_copied = { fg = "#7cd699", bg = "#7cd699" }
marker_cut = { fg = "#be3f50", bg = "#be3f50" }
marker_marked = { fg = "#04c5f0", bg = "#04c5f0" }
marker_selected = { fg = "#ff7f41", bg = "#ff7f41" }

# Tabs
tab_active = { fg = "#000000", bg = "#04c5f0", bold = true }
tab_inactive = { fg = "#11aeb3", bg = "#140e29" }
count_copied = { fg = "#000000", bg = "#7cd699" }
count_cut = { fg = "#ffffff", bg = "#be3f50" }
count_selected = { fg = "#000000", bg = "#ff7f41" }

# Border
border_symbol = "│"
border_style = { fg = "#251b4a" }

[status]
separator_open = ""
separator_close = ""
separator_style = { fg = "#251b4a", bg = "#251b4a" }

mode_normal = { fg = "#000000", bg = "#04c5f0", bold = true }
mode_select = { fg = "#000000", bg = "#ff7f41", bold = true }
mode_unset = { fg = "#ffffff", bg = "#be3f50", bold = true }

progress_label = { bold = true }
progress_normal = { fg = "#04c5f0", bg = "#140e29" }
progress_error = { fg = "#be3f50", bg = "#140e29" }

permissions_t = { fg = "#04c5f0" }
permissions_r = { fg = "#ff7f41" }
permissions_w = { fg = "#be3f50" }
permissions_x = { fg = "#7cd699" }
permissions_s = { fg = "#11aeb3" }

[select]
border = { fg = "#04c5f0" }
active = { fg = "#ff7f41", bold = true }
inactive = { fg = "#14b9b5" }

[input]
border = { fg = "#04c5f0" }
title = { fg = "#14b9b5" }
value = { fg = "#ffffff" }
selected = { bg = "#251b4a" }

[completion]
border = { fg = "#251b4a" }
active = { bg = "#251b4a", fg = "#04c5f0" }
inactive = { fg = "#14b9b5" }

[tasks]
border = { fg = "#251b4a" }
title = { fg = "#04c5f0" }
hovered = { underline = true }

[which]
cols = 3
mask = { bg = "#000000" }
cand = { fg = "#04c5f0" }
rest = { fg = "#11aeb3" }
desc = { fg = "#14b9b5" }
separator = "  "
separator_style = { fg = "#251b4a" }

[help]
on = { fg = "#04c5f0" }
exec = { fg = "#11aeb3" }
desc = { fg = "#14b9b5" }
hovered = { bg = "#251b4a", bold = true }
footer = { fg = "#000000", bg = "#04c5f0" }

[filetype]
rules = [
    # Media
    { mime = "image/*", fg = "#9147a8" },
    { mime = "video/*", fg = "#be3f50" },
    { mime = "audio/*", fg = "#ff7f41" },
    # Archives
    { mime = "application/*zip", fg = "#04c5f0" },
    { mime = "application/x-tar", fg = "#04c5f0" },
    { mime = "application/x-bzip2", fg = "#04c5f0" },
    { mime = "application/x-7z-compressed", fg = "#04c5f0" },
    { mime = "application/x-rar", fg = "#04c5f0" },
    # Code & Configs
    { url = "*.rs", fg = "#04c5f0" },
    { url = "*.kdl", fg = "#04c5f0" },
    { url = "*.toml", fg = "#ff7f41" },
    { url = "*.json", fg = "#ff7f41" },
    { url = "*.sh", fg = "#7cd699" },
    { url = "*.zsh", fg = "#7cd699" },
    { url = "*.md", fg = "#11aeb3" },
    # Directories
    { url = "*/", fg = "#04c5f0", bold = true },
]
